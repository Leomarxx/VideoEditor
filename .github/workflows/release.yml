name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for the release (e.g. v1.10.1)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;25.1.8937393"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 7.5.1
          chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK with version
        id: apk_info
        run: |
          APK_PATH=$(find apkEditorPro/build/outputs/apk/release -name "*.apk" | head -1)
          VERSION_NAME=$(grep 'versionName' apkEditorPro/src/main/AndroidManifest.xml | sed 's/.*versionName="\([^"]*\)".*/\1/')
          DEST="apkEditorPro/build/outputs/apk/release/APKEditorPro-${VERSION_NAME}.apk"
          if [ "$APK_PATH" != "$DEST" ]; then
            mv "$APK_PATH" "$DEST"
          fi
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKEditorPro-release
          path: ${{ steps.apk_info.outputs.apk_path }}

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag_name=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v${{ steps.apk_info.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: APK Editor Pro ${{ steps.tag.outputs.tag_name }}
          body: |
            ## APK Editor Pro ${{ steps.tag.outputs.tag_name }}

            ### Changes
            - See commit history for details.

            ### Assets
            - **APKEditorPro-${{ steps.apk_info.outputs.version }}.apk** — Signed release build
          files: ${{ steps.apk_info.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
